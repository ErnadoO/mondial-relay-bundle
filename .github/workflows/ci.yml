name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.stability == 'dev' && ' (dev)' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '6.4' }
          - { php: '8.3', symfony: '7.4' }
          - { php: '8.4', symfony: '7.4' }
          - { php: '8.4', symfony: '8.1' }
          # Symfony 8.2 is not released yet: test against the development branch
          - { php: '8.4', symfony: '8.2', stability: 'dev' }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, soap, simplexml
          coverage: none

      - name: Allow development versions
        if: matrix.stability == 'dev'
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Pin Symfony version
        run: |
          composer require --no-update \
            symfony/framework-bundle:${{ matrix.symfony }}.* \
            symfony/http-client:${{ matrix.symfony }}.* \
            symfony/stopwatch:${{ matrix.symfony }}.*

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse
